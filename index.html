<style>
  :root{
    /* dark theme (default) */
    --bg:#1A1815; --surface:#242220; --card:#322E29; --ink:#ECE9E2; --muted:#A39E95; --faint:#736E66;
    --line:rgba(255,255,255,0.10); --line2:rgba(255,255,255,0.16);
    --today:rgba(255,255,255,0.07); --today-ink:#C8C3BA; --primary-ink:#34C88C;
    --radius:10px; --radius-lg:14px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  :root[data-theme="light"]{
    --bg:#FBFAF7; --surface:#FFFFFF; --card:#EFEDE8; --ink:#23211C; --muted:#6B6862; --faint:#9A968E;
    --line:rgba(35,33,28,0.10); --line2:rgba(35,33,28,0.18);
    --today:rgba(35,33,28,0.055); --today-ink:#6B6862; --primary-ink:#0F6E56;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; overscroll-behavior:none;}
  .app{display:flex; flex-direction:row; height:100vh; height:100dvh;}
  .sidebar{flex:0 0 52px; display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 0; border-right:0.5px solid var(--line); background:var(--surface);}
  .side-btn{width:36px; height:36px; border-radius:9px; border:0.5px solid var(--line2); background:var(--surface); cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--muted);}
  .side-btn:active{transform:scale(.96);}
  .side-btn svg{width:18px; height:18px;}
  .content{flex:1 1 auto; display:flex; flex-direction:column; min-width:0; height:100%; position:relative;}

  header.topbar{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:16px 22px 12px; border-bottom:0.5px solid var(--line); min-height:18px;}
  .topbar h1{margin:0; font-family:var(--serif); font-weight:500; font-size:25px; letter-spacing:-0.01em;}
  .icon-btn{width:34px; height:34px; border-radius:9px; border:0.5px solid var(--line2); background:var(--surface);
    cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--muted);}
  .icon-btn:active{transform:scale(.96);}
  .icon-btn svg{width:17px; height:17px;}
  .txt-btn{font:inherit; font-size:14px; color:var(--ink); background:var(--surface);
    border:0.5px solid var(--line2); border-radius:var(--radius); padding:7px 14px; cursor:pointer;}
  .txt-btn:active{transform:scale(.98);}
  .txt-btn.primary{border-color:#1D9E75; color:var(--primary-ink);}

  .main{flex:1 1 auto; display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:16px; padding:16px 22px 22px; min-height:0;}

  .tl-wrap{background:var(--surface); border:0.5px solid var(--line); border-radius:var(--radius-lg); overflow:hidden; display:flex; flex-direction:column; min-height:0;}
  .tl-scroll{overflow:auto; flex:1 1 auto; touch-action:pan-x pan-y;}
  .tl-inner{position:relative;}
  /* never let a drag (esp. Apple Pencil) select text on the timeline */
  .tl-inner{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .tl-inner input, .tl-inner textarea, .lbl[contenteditable="true"]{ -webkit-user-select:text; user-select:text; }
  .wk-head{display:grid; border-bottom:0.5px solid var(--line2);}
  .wk-head > div{padding:9px 14px; font-weight:500; font-size:13px; color:var(--ink); border-right:0.5px solid var(--line);}
  .wk-head > div:last-child{border-right:none;}
  .day-head{display:grid; border-bottom:0.5px solid var(--line);}
  .day-head > div{padding:4px 0 6px; text-align:center; font-size:11px; color:var(--faint);}
  .day-head > div.today{color:var(--today-ink); font-weight:500;}
  .zone-label{display:flex; align-items:center; gap:8px; padding:5px 14px; background:var(--bg);
    border-bottom:0.5px solid var(--line); font-size:10px; letter-spacing:.06em; color:var(--faint);}
  .proj-zone{position:relative; padding:10px 0 6px;}
  .today-col{position:absolute; top:0; bottom:0; background:var(--today); pointer-events:none;}
  .proj-row{position:relative; height:30px; margin-bottom:6px;}
  .bar{position:absolute; height:26px; border-radius:var(--radius); display:flex; align-items:center;
    cursor:pointer; border:0.5px solid; font-size:12.5px; font-weight:500; white-space:nowrap;}
  /* content rides the visible edge of the bar so it's always readable while scrolling */
  .bar-sticky{position:sticky; left:0; z-index:1; display:flex; align-items:center; gap:7px; height:100%; padding:0 9px; max-width:100%; min-width:0; box-sizing:border-box;}
  .bar .lbl{overflow:hidden; text-overflow:ellipsis;}
  .bar.done .lbl{text-decoration:line-through; opacity:.55;}
  .task-zone{display:grid; align-items:start; padding-top:9px; min-height:150px;}
  .day-col{padding:0 4px; display:flex; flex-direction:column; gap:5px;}
  .chip{border-radius:8px; border:0.5px solid; padding:5px 6px; font-size:11.5px; line-height:1.25;
    cursor:pointer; display:flex; gap:5px; align-items:flex-start;}
  /* one-line titles so every card is the same height at a given zoom (predictable + easy to reorder) */
  .chip .lbl{flex:1 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chip.done .lbl{text-decoration:line-through; opacity:.5;}
  .cbx{flex:0 0 auto; width:14px; height:14px; border-radius:4px; border:1px solid currentColor; margin-top:1px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:.6;}
  .cbx svg{width:9px; height:9px; display:none;}
  .cbx.on{opacity:1;} .cbx.on svg{display:block;}
  .bar .cbx{margin-top:0;}
  /* task cards use the vibrant area color (--ac) only for the checkbox + edit icon; the card itself is neutral gray */
  .chip .cbx{ border-color:var(--ac); color:var(--ac); opacity:.9; }
  .chip .edit-btn{ color:var(--ac); opacity:.5; }
  .chip .edit-btn:hover{ opacity:1; }
  /* completion animation: fill the box, draw the check, strike the title, then fade out */
  .chip.completing, .bar.completing{ transition:opacity .34s ease, transform .34s ease; opacity:.35; }
  .chip.completing .lbl, .bar.completing .lbl{ text-decoration:line-through; opacity:.5; transition:opacity .2s; }
  .chip.completing .cbx, .bar.completing .cbx{ background:var(--ac); border-color:var(--ac); color:#fff; opacity:1; }
  .chip.completing .cbx svg, .bar.completing .cbx svg{ display:block; animation:checkpop .24s ease; }
  @keyframes checkpop{ from{ transform:scale(.3); opacity:.2; } to{ transform:scale(1); opacity:1; } }

  .rail{display:flex; flex-direction:column; min-height:0; overflow:hidden;}
  .rail-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding-left:2px; flex:0 0 auto;}
  .rail-head .t{font-size:13px; font-weight:500; color:var(--muted);}
  .rail-actions{display:flex; align-items:center; gap:6px;}
  .gallery{display:flex; flex-direction:column; gap:11px; overflow-y:auto; flex:1 1 auto; min-height:0; padding-right:3px;}
  /* draggable divider between timeline and areas rail */
  .divider{cursor:ew-resize; position:relative; align-self:stretch; touch-action:none;}
  .divider::after{content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:3px; height:34px; background:var(--line2); border-radius:3px; transition:background .12s, height .12s;}
  .divider:hover::after, .divider.active::after{background:var(--muted); height:60px;}
  .rail-expand{position:absolute; top:18px; right:14px; z-index:20; width:32px; height:32px; border-radius:9px;
    border:0.5px solid var(--line2); background:var(--surface); color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .rail-expand:active{transform:scale(.96);}
  .rail-expand svg{width:17px; height:17px;}
  .area-card{flex:0 0 auto; background:var(--surface); border:0.5px solid var(--line); border-radius:var(--radius-lg);
    overflow:hidden; cursor:pointer; transition:border-color .12s;}
  .area-card:hover{border-color:var(--line2);}
  .area-cover{height:74px; background-size:cover; background-position:center;}
  .area-meta{padding:10px 12px;}
  .area-meta .nm{font-size:14.5px; font-weight:500;}

  .detail{flex:1 1 auto; overflow:auto; padding:0 22px 28px;}
  .detail-hero{height:150px; border-radius:var(--radius-lg); background-size:cover; background-position:center; margin:16px 0 14px; background-color:var(--bg);}
  .detail .dsub{color:var(--muted); font-size:13px; margin-bottom:20px;}
  .panel{background:var(--surface); border:0.5px solid var(--line); border-radius:var(--radius-lg); padding:16px 18px; margin-bottom:14px; max-width:760px;}
  .panel h3{margin:0 0 12px; font-size:15px; font-weight:500;}
  .panel .row{display:flex; justify-content:space-between; padding:7px 0; border-bottom:0.5px solid var(--line); font-size:14px;}
  .panel .row:last-child{border-bottom:none;}
  .panel .row .v{color:var(--muted);}

  .grade-row{display:grid; grid-template-columns:1fr 70px 70px 30px; gap:8px; align-items:center; margin-bottom:8px;}
  .grade-row input{font:inherit; font-size:13px; padding:6px 8px; border:0.5px solid var(--line2); border-radius:8px; background:var(--bg); width:100%;}
  .grade-row .rm{background:none; border:none; color:var(--faint); cursor:pointer; font-size:16px;}
  .grade-head{display:grid; grid-template-columns:1fr 70px 70px 30px; gap:8px; font-size:11px; color:var(--faint); margin-bottom:6px; padding:0 2px;}
  .wsum{font-size:11px; color:var(--faint); text-align:center; margin-top:2px;}
  .wsum-line{display:grid; grid-template-columns:1fr 70px 70px 30px; gap:8px;}
  .grade-foot{display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding-top:14px; border-top:0.5px solid var(--line);}
  .grade-foot .big{font-family:var(--serif); font-size:30px; font-weight:500;}
  .add-grade{background:none; border:0.5px dashed var(--line2); border-radius:8px; padding:7px; width:100%; cursor:pointer; color:var(--muted); font:inherit; font-size:13px; margin-top:4px;}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
  .field input[type=text], .field textarea{width:100%; font:inherit; font-size:14px; padding:9px 11px;
    border:0.5px solid var(--line2); border-radius:9px; background:var(--bg); resize:vertical;}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0;}
  .toggle-row .tl-label{font-size:14px;}
  .toggle-row .tl-hint{font-size:12px; color:var(--faint); margin-top:2px;}
  .switch{position:relative; width:44px; height:26px; flex:0 0 auto; cursor:pointer;}
  .switch input{opacity:0; width:0; height:0;}
  .switch .track{position:absolute; inset:0; background:var(--line2); border-radius:99px; transition:.15s;}
  .switch .knob{position:absolute; top:3px; left:3px; width:20px; height:20px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .switch input:checked + .track{background:#1D9E75;}
  .switch input:checked + .track + .knob{transform:translateX(18px);}

  /* color picker */
  .swatches{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .swatch{width:30px; height:30px; border-radius:8px; cursor:pointer; border:2px solid transparent;}
  .swatch.sel{border-color:var(--ink);}
  .swatch.custom{display:flex; align-items:center; justify-content:center; color:#fff; background:conic-gradient(#D85A30,#BA7517,#639922,#1D9E75,#378ADD,#7F77DD,#D4537E,#D85A30); position:relative; overflow:hidden;}
  .swatch.custom input{position:absolute; inset:0; opacity:0; cursor:pointer;}

  /* cover picker */
  .cover-preview{height:120px; border-radius:var(--radius-lg); background-size:cover; background-position:center; background-color:var(--bg); border:0.5px solid var(--line); margin-bottom:10px;}
  .cover-preview.croppable{cursor:grab; touch-action:pan-y; margin-bottom:8px;}
  .cover-preview.croppable:active{cursor:grabbing;}
  .crop-controls{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .tabs{display:flex; gap:6px; margin-bottom:12px;}
  .tab{font:inherit; font-size:13px; padding:6px 12px; border-radius:8px; border:0.5px solid var(--line2); background:var(--surface); color:var(--muted); cursor:pointer;}
  .tab.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  .uns-search{display:flex; gap:8px; margin-bottom:10px;}
  .uns-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
  .uns-thumb{aspect-ratio:1; border-radius:8px; background-size:cover; background-position:center; cursor:pointer; border:2px solid transparent; background-color:var(--bg);}
  .uns-thumb.sel{border-color:#1D9E75;}
  .hint{font-size:12px; color:var(--faint); margin-top:8px;}
  .credit{font-size:11px; color:var(--faint); margin-top:8px;}

  .overlay{position:absolute; inset:0; background:rgba(35,33,28,.4); display:flex; align-items:center; justify-content:center; z-index:50;}

  /* search overlay */
  .search-overlay{position:fixed; inset:0; background:rgba(35,33,28,.35); display:flex; align-items:flex-start; justify-content:center; z-index:100; padding-top:8vh;}
  .search-box{width:min(620px,92vw); max-height:80vh; background:var(--surface); border:0.5px solid var(--line2); border-radius:var(--radius-lg); box-shadow:0 12px 40px rgba(0,0,0,.18); display:flex; flex-direction:column; overflow:hidden;}
  .search-top{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:0.5px solid var(--line); color:var(--faint);}
  .search-top svg{width:18px; height:18px; flex:0 0 auto;}
  .search-top input{flex:1; font:inherit; font-size:15px; border:none; outline:none; background:transparent; color:var(--ink);}
  .search-results{overflow:auto; padding:4px 0;}
  .sr-row{display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:0.5px solid var(--line);}
  .sr-row:last-child{border-bottom:none;}
  .sr-main{flex:1 1 auto; min-width:0;}
  .sr-title{font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sr-row.done .sr-title{text-decoration:line-through; opacity:.5;}
  .sr-meta{font-size:11px; color:var(--faint); margin-top:2px;}
  .sr-dot{width:9px; height:9px; border-radius:3px; flex:0 0 auto;}
  .sr-empty{padding:22px 14px; color:var(--faint); font-size:13px; text-align:center;}
  .sr-recent-h{padding:9px 14px 5px; font-size:11px; letter-spacing:.05em; color:var(--faint); text-transform:uppercase;}
  .danger-btn{margin-top:12px; width:100%; background:none; border:0.5px solid #D4537E; color:#E07B9E; border-radius:9px; padding:9px; font:inherit; font-size:13px; cursor:pointer;}
  .danger-btn:active{transform:scale(.99);}

  /* settings, quick-add, project resize handles */
  .side-bottom{margin-top:auto;}
  .sel{width:100%; font:inherit; font-size:14px; padding:9px 11px; border:0.5px solid var(--line2); border-radius:9px; background:var(--bg); color:var(--ink);}
  .seg{display:flex; gap:8px; margin-bottom:14px;}
  .seg .tab{flex:1;}
  .bar-handle{position:absolute; top:0; bottom:0; width:10px; z-index:2; cursor:ew-resize; touch-action:none;}
  .bar-handle.l{left:0;} .bar-handle.r{right:0;}

  /* readable form text + quiet scrollbars in dark mode */
  input, textarea, select{ color:var(--ink); }
  ::placeholder{ color:var(--faint); opacity:1; }
  *{ scrollbar-width:thin; scrollbar-color:var(--line2) transparent; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--line2); border-radius:6px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--muted); }
  ::-webkit-scrollbar-track{ background:transparent; }
  /* Notion-style hover “+” to add */
  .proj-zone{ min-height:46px; }
  .day-col{ min-height:130px; }
  .cell-add{ width:22px; height:22px; border:1px dashed var(--line2); border-radius:6px; color:var(--faint); display:flex; align-items:center; justify-content:center; opacity:0; cursor:pointer; margin:3px auto 0; transition:opacity .12s, border-color .12s; background:transparent; padding:0; }
  .cell-add svg{ width:13px; height:13px; }
  .day-col:hover .cell-add, .proj-add .slot:hover .cell-add{ opacity:.7; }
  .cell-add:hover{ opacity:1; border-color:var(--muted); color:var(--ink); }
  .proj-add{ position:absolute; inset:0; display:grid; z-index:0; }
  .proj-add .slot{ display:flex; align-items:flex-start; justify-content:center; }
  /* draggable chips + inline title editing */
  .chip{ touch-action:none; user-select:none; flex-direction:column; align-items:stretch; gap:3px; }
  .chip-top{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .lbl[data-edit]{ cursor:text; }
  .lbl[contenteditable="true"]{ outline:1px solid currentColor; border-radius:4px; padding:0 2px; user-select:text; white-space:normal; }
  .bar .lbl{ min-width:0; flex:0 1 auto; }
  .edit-btn{ flex:0 0 auto; width:16px; height:16px; padding:0; border:none; background:none; color:currentColor; opacity:.32; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .edit-btn:hover{ opacity:1; }
  .edit-btn svg{ width:12px; height:12px; }

  /* area emoji tags on bars, chips, and gallery cards */
  .tag-emoji{ flex:0 0 auto; font-size:12.5px; line-height:1; }
  .ct-left{ display:flex; align-items:center; gap:4px; min-width:0; }
  .nm-emoji{ margin-right:6px; }
  /* emoji picker in the area form */
  .emoji-row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }

function resyncStates(fromS, toS){
  const idx=arr=>{ const m={}; arr.forEach(x=>m[x.id]=x); return m; };
  const oT=idx(fromS.T), nT=idx(toS.T), oP=idx(fromS.P), nP=idx(toS.P);
  for(const id in nT){ const n=nT[id], o=oT[id]||{}; let ch=false;
    if(o.day!==n.day){ sync("update",{id, due_date:ymd(n.day)}); ch=true; }
    if(o.title!==n.title){ sync("update",{id, title:n.title}); ch=true; }
    if(o.area!==n.area){ sync("update",{id, area:n.area}); ch=true; }
    if(!!o.done!==!!n.done){ sync(n.done?"complete":"reopen",{id}); ch=true; }
    if(ch || !oT[id]) saveTask(n);
  }
  for(const id in oT){ if(!nT[id]){ sync("delete",{id}); SB.from('tasks').delete().eq('id',id); } }
  for(const id in nP){ const n=nP[id], o=oP[id]||{}; let ch=false;
    if(o.start!==n.start||o.len!==n.len){ sync("update",{id, due_date:ymd(n.start), deadline_date:ymd(n.start+n.len-1)}); ch=true; }
    if(o.title!==n.title){ sync("update",{id, title:n.title}); ch=true; }
    if(o.area!==n.area){ sync("update",{id, area:n.area}); ch=true; }
    if(!!o.done!==!!n.done){ sync(n.done?"complete":"reopen",{id}); ch=true; }
    if(ch || !oP[id]) saveProject(n);
  }
  for(const id in oP){ if(!nP[id]){ sync("delete",{id}); SB.from('projects').delete().eq('id',id); } }
}
function undo(){ if(!undoStack.length) return; const cur=snapshot(); redoStack.push(cur); const prev=undoStack.pop(); restoreState(prev); mount(); pending++; resyncStates(cur, prev); setTimeout(()=>{ pending--; }, 1200); }
function redo(){ if(!redoStack.length) return; const cur=snapshot(); undoStack.push(cur); const nxt=redoStack.pop(); restoreState(nxt); mount(); pending++; resyncStates(cur, nxt); setTimeout(()=>{ pending--; }, 1200); }

function coverStyle(a){
  if(a.cover){
    const x=(a.coverX==null?50:a.coverX), y=(a.coverY==null?50:a.coverY), z=(a.coverZoom==null?100:a.coverZoom);
    return `background-image:url('${a.cover}'); background-color:${a.color}; background-position:${x}% ${y}%; background-size:${z}%;`;
  }
  return `background-color:${a.color}; background-image:linear-gradient(135deg, ${a.color}, ${a.tint});`;
}

function renderTimeline(){
  const firstIdx=win.start, totalDays=win.weeks*7, lastIdx=firstIdx+totalDays, innerW=totalDays*COLW;
  /* pack projects into rows: earliest start on top, stacking non-overlapping projects on the same row */
  const vis=PROJECTS.filter(p=>!p.done && AREAS[p.area] && (p.start+p.len)>firstIdx && p.start<lastIdx)
    .slice().sort((a,b)=> a.start-b.start || b.len-a.len);
  const packed=[];
  vis.forEach(p=>{
    const end=p.start+p.len;
    let r=0;
    for(; r<packed.length; r++){ if(packed[r].every(q=> p.start>=q.start+q.len || end<=q.start)) break; }
    if(r===packed.length) packed.push([]);
    packed[r].push(p);
  });
  const projRows=packed.map(rowArr=>`<div class="proj-row">`+rowArr.map(p=>{
    const a=AREAS[p.area];
    const em=a.emoji?`<span class="tag-emoji">${a.emoji}</span>`:'';
    return `<div class="bar" data-pid="${p.id}" style="left:calc(var(--colw) * ${p.start-firstIdx}); width:calc(var(--colw) * ${p.len} - 5px); background:${a.tint}; border-color:${a.color}; color:${a.ink}; --ac:${a.color};">
      <span class="bar-handle l" data-resize="l" data-id="${p.id}"></span>
      <div class="bar-sticky"><span class="cbx" data-cbx="proj" data-id="${p.id}">${ICON.check}</span>${em}${p.recurring?`<span class="rep">${ICON.repeat}</span>`:''}<span class="lbl" data-edit data-kind="proj" data-id="${p.id}">${p.title}</span><button class="edit-btn" data-editbtn data-kind="proj" data-id="${p.id}" aria-label="Edit">${ICON.pencil}</button></div>
      <span class="bar-handle r" data-resize="r" data-id="${p.id}"></span></div>`;
  }).join("")+`</div>`).join("");
  /* ghost occurrences of recurring tasks (their next 2 upcoming dates), shown dimmed */
  const ghostsByDay={};
  TASKS.forEach(t=>{ if(t.recurring && !t.done && AREAS[t.area] && Array.isArray(t.recDays)){
    t.recDays.slice(1).forEach(di=>{ if(di>firstIdx-1 && di<lastIdx){ (ghostsByDay[di]=ghostsByDay[di]||[]).push(t); } });
  }});
  let dayCols="";
  for(let d=0; d<totalDays; d++){
    const idx=firstIdx+d;
    const items=TASKS.filter(t=>t.day===idx && !t.done && AREAS[t.area]).map(t=>{
      const a=AREAS[t.area];
      const em=a.emoji?`<span class="tag-emoji">${a.emoji}</span>`:'';
      const rep=t.recurring?`<span class="rep">${ICON.repeat}</span>`:'';
      return `<div class="chip" data-task-id="${t.id}" style="background:var(--card); border-color:var(--line2); color:var(--ink); --ac:${a.color};">
        <div class="chip-top"><div class="ct-left"><span class="cbx" data-cbx="task" data-id="${t.id}">${ICON.check}</span>${em}${rep}</div><button class="edit-btn" data-editbtn data-kind="task" data-id="${t.id}" aria-label="Edit">${ICON.pencil}</button></div>
        <span class="lbl" data-edit data-kind="task" data-id="${t.id}">${t.title}</span></div>`;
    }).join("");
    const ghosts=(ghostsByDay[idx]||[]).map(t=>{
      const a=AREAS[t.area];
      const em=a.emoji?`<span class="tag-emoji">${a.emoji}</span>`:'';
      return `<div class="chip ghost" style="background:var(--card); border-color:var(--line2); color:var(--ink); --ac:${a.color};" title="Recurring — upcoming">
        <div class="chip-top"><div class="ct-left">${em}<span class="rep">${ICON.repeat}</span></div></div>
        <span class="lbl">${t.title}</span></div>`;
    }).join("");
    dayCols+=`<div class="day-col" data-day="${idx}">${items}${ghosts}<button class="cell-add" data-add="task" data-day="${idx}" aria-label="Add task">${ICON.plus}</button></div>`;
  }
  let projAddSlots="";
  for(let d=0; d<totalDays; d++){ const idx=firstIdx+d; projAddSlots+=`<div class="slot"><button class="cell-add" data-add="project" data-day="${idx}" aria-label="Add project">${ICON.plus}</button></div>`; }
  let dayHeadCells="";
  for(let d=0; d<totalDays; d++){ const idx=firstIdx+d; const dt=dateForIndex(idx); dayHeadCells+=`<div class="${idx===TODAY?'today':''}" data-day="${idx}"><span class="ddow">${DOW[dt.getDay()]}</span><span class="dnum">${dt.getDate()}</span></div>`; }
  let weekCells="";
  for(let w=0; w<win.weeks; w++){ const s=firstIdx+w*7; weekCells+=`<div>${fmtDay(s)} – ${fmtDay(s+6)}</div>`; }
  const todayLeft=(TODAY-firstIdx)*COLW;
  const areaCards=Object.entries(AREAS).map(([key,a])=>{
    return `<div class="area-card" data-area="${key}"><div class="area-cover" style="${coverStyle(a)}"></div>
      <div class="area-meta"><div class="nm">${a.emoji?`<span class="nm-emoji">${a.emoji}</span>`:''}${a.name}</div></div></div>`;
  }).join("");
  const gridCols=railOpen?`minmax(0,1fr) 8px ${railW}px`:`minmax(0,1fr)`;
  const railHtml=railOpen?`
    <div class="divider" id="railDivider" aria-label="Resize areas"></div>
    <div class="rail">
      <div class="rail-head"><span class="t">Areas</span><div class="rail-actions">
        <button class="icon-btn" id="addArea" aria-label="Add area" style="width:28px;height:28px;">${ICON.plus}</button>
        <button class="icon-btn" id="railToggle" aria-label="Hide areas" style="width:28px;height:28px;">${ICON.chevR}</button>
      </div></div>
      <div class="gallery">${areaCards}</div>
    </div>`:'';
  const expandBtn=railOpen?'':`<button class="rail-expand" id="railToggle" aria-label="Show areas">${ICON.chevL}</button>`;
  return `<div class="main" style="grid-template-columns:${gridCols};">
    <div class="tl-wrap"><div class="tl-scroll"><div class="tl-inner" style="--colw:${COLW}px; width:calc(var(--colw) * ${totalDays});">
      <div class="tl-head">
        <div class="wk-head" style="grid-template-columns:repeat(${win.weeks}, calc(var(--colw) * 7));">${weekCells}</div>
        <div class="day-head" style="grid-template-columns:repeat(${totalDays}, var(--colw));">${dayHeadCells}</div>
      </div>
      <div class="zone-label">PROJECTS</div>
      <div class="proj-zone"><div class="proj-add" style="grid-template-columns:repeat(${totalDays}, var(--colw));">${projAddSlots}</div><div class="today-col" style="left:calc(var(--colw) * ${TODAY-firstIdx}); width:var(--colw);"></div>${projRows}</div>
      <div class="zone-label">TASKS</div>
      <div class="task-zone" style="grid-template-columns:repeat(${totalDays}, var(--colw)); position:relative;"><div class="today-col" style="left:calc(var(--colw) * ${TODAY-firstIdx}); width:var(--colw);"></div>${dayCols}</div>
    </div></div></div>${railHtml}
  </div>${expandBtn}<button class="today-fab" id="todayFab" aria-label="Back to today"><span class="ddow">${DOW[dateForIndex(TODAY).getDay()]}</span><span class="dnum">${dateForIndex(TODAY).getDate()}</span></button>`;
}

function renderArea(key){
  const a=AREAS[key];
  const projs=PROJECTS.filter(p=>p.area===key), tasks=TASKS.filter(t=>t.area===key);
  const openTasks=tasks.filter(t=>!t.done).length;
  const projList=projs.length?projs.map(p=>`<div class="row"><span style="${p.done?'text-decoration:line-through;opacity:.5':''}">${p.title}</span><span class="v">${p.len} days</span></div>`).join(""):`<div class="v" style="color:var(--faint)">No active projects.</div>`;
  const taskList=tasks.length?tasks.map(t=>`<div class="row"><span style="${t.done?'text-decoration:line-through;opacity:.5':''}">${t.title}</span><span class="v">${fmtDay(t.day)}</span></div>`).join(""):`<div class="v" style="color:var(--faint)">No tasks.</div>`;
  let grade="";
  if(a.graded){
    const rows=a.grades.map((g,i)=>`<div class="grade-row" data-gi="${i}">
      <input value="${(g.name||'').replace(/"/g,'&quot;')}" data-g="name"><input value="${g.score}" placeholder="—" data-g="score" inputmode="decimal">
      <input value="${g.weight}" placeholder="—" data-g="weight" inputmode="decimal"><button class="rm" data-grm>×</button></div>`).join("");
    grade=`<div class="panel"><h3>Grade calculator</h3>
      <div class="grade-head"><div>Item</div><div>Score %</div><div>Weight %</div><div></div></div>
      <div id="gradeRows">${rows}</div>
      <div class="wsum-line"><div></div><div></div><div class="wsum" id="wsum"></div><div></div></div>
      <button class="add-grade" id="addGrade">+ Add item</button>
      <div class="grade-foot"><div style="font-size:12px;color:var(--muted)">Current grade</div><div class="big" id="gOut" style="color:${a.color}">—</div></div></div>`;
  }
  return `<div class="detail">
    <div class="detail-hero" style="${coverStyle(a)}"></div>
    <div class="dsub">${a.note||""}</div>
    <div class="panel"><h3>At a glance</h3>
      <div class="row"><span>Active projects</span><span class="v">${projs.length}</span></div>
      <div class="row"><span>Open tasks</span><span class="v">${openTasks} of ${tasks.length}</span></div></div>
    ${grade}
    <div class="panel"><h3>Projects</h3>${projList}</div>
    <div class="panel"><h3>Tasks</h3>${taskList}</div>
  </div>`;
}

function recalcGrade(){
  const key=view.area; if(!key||!AREAS[key]||!AREAS[key].graded) return;
  const rows=[...document.querySelectorAll('#gradeRows .grade-row')];
  let earned=0, scoredW=0, totalW=0;
  rows.forEach(r=>{
    const s=parseFloat(r.querySelector('[data-g="score"]').value);
    const w=parseFloat(r.querySelector('[data-g="weight"]').value);
    if(!isNaN(w)){ totalW+=w; if(!isNaN(s)){ earned+=s*w; scoredW+=w; } }
  });
  const out=document.getElementById('gOut'), ws=document.getElementById('wsum');
  if(out) out.textContent = scoredW>0 ? (earned/scoredW).toFixed(1)+"%" : "—";
  if(ws) ws.textContent = totalW>0 ? `Σ ${(+totalW.toFixed(2))}%` : "";
}
function syncGradesToModel(){
  const key=view.area; if(!key||!AREAS[key]||!AREAS[key].graded) return;
  const rows=[...document.querySelectorAll('#gradeRows .grade-row')];
  if(!rows.length) return;
  AREAS[key].grades=rows.map(r=>({name:r.querySelector('[data-g="name"]').value,score:r.querySelector('[data-g="score"]').value,weight:r.querySelector('[data-g="weight"]').value}));
}

function openEditItem(kind, id){
  const list=kind==="proj"?PROJECTS:TASKS; const it=list.find(x=>x.id===id); if(!it) return;
  editDraft = kind==="proj" ? {id, type:"project", title:it.title, desc:it.desc||"", area:it.area, start:it.start, len:it.len, oarea:it.area}
                            : {id, type:"task", title:it.title, desc:it.desc||"", area:it.area, start:it.day, len:1, oarea:it.area};
  editOpen=true; mount();
}
function captureEdit(){
  if(!editDraft) return;
  const ti=document.getElementById('editTitle'); if(ti) editDraft.title=ti.value;

/* ---- undated-item scheduler ---- */
const SCHED_PROJ_LEN=3;
function scheduleUnsched(id, idx){
  const u=UNSCHED.find(x=>x.id===id); if(!u) return;
  /* optimistic: drop it onto the timeline instantly, then reconcile with Todoist */
  UNSCHED=UNSCHED.filter(x=>x.id!==id);
  if(u.isProject){ PROJECTS.push({id, area:u.area, title:u.title, desc:"", start:idx, len:SCHED_PROJ_LEN, done:false, recurring:false}); }
  else { TASKS.push({id, area:u.area, title:u.title, desc:"", day:idx, done:false, recurring:false, recDays:[], ord:0}); }
  mount();
  pending++;
  sync("update",{id, due_date:ymd(idx), deadline_date:u.isProject?ymd(idx+SCHED_PROJ_LEN-1):undefined})
    .then(()=>syncPull()).then(()=>{ if(view.page==="timeline" && !uiBusy()) mount(); }).finally(()=>{ pending--; });
}
function renderSched(){
  const items = UNSCHED.length ? UNSCHED.map(u=>{ const a=AREAS[u.area]||{};

    : `<div class="sr-empty">Nothing unscheduled.</div>`;
  return `<div class="sched-drawer" id="schedDrawer">

function initSched(){

/* a floating preview that looks like the final chip */
function chipPreview(a, title){

  c.style.background='var(--card)'; c.style.borderColor=a.color||'var(--line2)'; c.style.color='var(--ink)';

}
/* shared card drag: floating preview + a white-outline placeholder that drops exactly where you release,
   with the other cards in that day sliding aside to make room */
function beginCardDrag(ev, cfg){
  const sx=ev.clientX, sy=ev.clientY; let dragging=false, card=null, ph=null, phCol=null, phBeforeId=null;
  const phH = cfg.sourceEl ? Math.round(cfg.sourceEl.getBoundingClientRect().height) : 34;
  const removePh=()=>{ if(ph&&ph.parentNode) ph.parentNode.removeChild(ph); };
  const placePh=(x,y)=>{
    removePh();
    const under=document.elementFromPoint(x,y);
    const col=under&&under.closest?under.closest('.day-col[data-day]'):null;
    if(!col){ phCol=null; phBeforeId=null; return; }
    const chips=[...col.querySelectorAll('.chip[data-task-id]')].filter(c=>!c.classList.contains('dragging-src'));
    let ref=null;
    for(const c of chips){ const r=c.getBoundingClientRect(); if(y < r.top + r.height/2){ ref=c; break; } }
    if(!ph){ ph=document.createElement('div'); ph.className='chip-ph'; ph.style.height=phH+'px'; }
    col.insertBefore(ph, ref || col.querySelector('.cell-add'));
    phCol=col; phBeforeId=ref?ref.dataset.taskId:null;
  };
  const startDrag=()=>{ dragging=true; document.body.classList.add('card-dragging'); if(cfg.fromUnsched) document.body.classList.add('sched-dragging'); if(cfg.sourceEl) cfg.sourceEl.classList.add('dragging-src');
    card=chipPreview(cfg.a, cfg.title); document.body.appendChild(card); };
  const move=mev=>{ if(!dragging){ if(Math.abs(mev.clientX-sx)>5||Math.abs(mev.clientY-sy)>5) startDrag(); else return; }
    card.style.transform=`translate(calc(${mev.clientX}px - 50%), calc(${mev.clientY}px - 130%))`; placePh(mev.clientX, mev.clientY); };
  const up=mev=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
    document.body.classList.remove('card-dragging','sched-dragging'); if(cfg.sourceEl) cfg.sourceEl.classList.remove('dragging-src');
    const col=phCol, beforeId=phBeforeId; removePh(); if(card) card.remove();
    if(dragging){ suppressClickUntil=Date.now()+300; if(col) cfg.onDrop(parseInt(col.dataset.day,10), beforeId); else if(cfg.onCancel) cfg.onCancel(); }
  };
  document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
}
/* move a task to a day, inserting it before `beforeId` (or at the end), and renumber affected days */
function renumberDay(day){ let o=0; TASKS.forEach(x=>{ if(x.day===day) x.ord=o++; }); }
function moveTaskTo(t, day, beforeId){
  const oldDay=t.day; t.day=day;
  TASKS=TASKS.filter(x=>x!==t);
  let at;
  if(beforeId){ at=TASKS.findIndex(x=>x.id===beforeId); if(at<0) at=TASKS.length; }
  else { let last=-1; TASKS.forEach((x,i)=>{ if(x.day===day) last=i; }); at=(last<0?TASKS.length:last+1); }
  TASKS.splice(at,0,t);
  renumberDay(day); if(oldDay!==day) renumberDay(oldDay);
  return oldDay;
}
/* drag task chips (change date) and project bars (move start date) */
function initChips(){
  document.querySelectorAll('.chip[data-task-id]').forEach(ch=>{
    ch.addEventListener('pointerdown', ev=>{
      if(editing || pinch) return; if(ev.target.closest('.cbx') || ev.target.closest('.edit-btn')) return;
      if(pPencilOnly && ev.pointerType!=='pen') return;
      const id=ch.dataset.taskId; const t=TASKS.find(x=>x.id===id); if(!t) return;
      ev.preventDefault();
      if(ev.pointerType==='pen'){ try{ ch.setPointerCapture(ev.pointerId); }catch(e){} }
      const a=AREAS[t.area]||{};
      beginCardDrag(ev, {a, title:t.title, sourceEl:ch, onDrop:(day, beforeId)=>{
        const dayChanged=(day!==t.day);
        pushUndo();
        const oldDay=moveTaskTo(t, day, beforeId);
        if(dayChanged) sync("update",{id, due_date:ymd(day)});
        TASKS.filter(x=>x.day===day || (dayChanged && x.day===oldDay)).forEach(saveTask);  // persist new order
        mount();
      }});
    });
  });
  document.querySelectorAll('.bar[data-pid]').forEach(bar=>{
    bar.addEventListener('pointerdown', ev=>{
      if(editing || pinch) return;
      if(ev.target.closest('.bar-handle')||ev.target.closest('.cbx')||ev.target.closest('.edit-btn')||ev.target.closest('.lbl[data-edit]')) return;
      if(pPencilOnly && ev.pointerType!=='pen') return;
      const id=bar.dataset.pid; const p=PROJECTS.find(x=>x.id===id); if(!p) return;
      ev.preventDefault();
      if(ev.pointerType==='pen'){ try{ bar.setPointerCapture(ev.pointerId); }catch(e){} }
      const sx=ev.clientX, baseLeft=(p.start-win.start)*COLW; let moved=false;
      const move=mev=>{ const dx=mev.clientX-sx; if(!moved && Math.abs(dx)>5){ moved=true; bar.style.zIndex="6"; bar.style.opacity=".9"; } if(moved) bar.style.left=(baseLeft+dx)+"px"; };
      const up=mev=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); bar.style.zIndex=""; bar.style.opacity="";
        if(moved){ const dd=Math.round((mev.clientX-sx)/COLW); suppressClickUntil=Date.now()+300; if(dd!==0){ pushUndo(); p.start=p.start+dd; saveProject(p); sync("update",{id, due_date:ymd(p.start), deadline_date:ymd(p.start+p.len-1)}); } mount(); } };
      document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
    });
  });
}

/* inline title editing (click a title on the timeline) */
function startTitleEdit(el){
  if(editing) return;
  editing={el, kind:el.dataset.kind, id:el.dataset.id, orig:el.textContent};
  el.setAttribute('contenteditable','true'); el.spellcheck=false; el.focus();
  const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r);

function commitTitleEdit(cancel){
  if(!editing) return;
  const {el, kind, id, orig}=editing; editing=null;
  el.removeAttribute('contenteditable');
  let val=(el.textContent||"").replace(/\s+/g," ").trim();

  if(val===(orig||"").trim()) return;
  const list=kind==="proj"?PROJECTS:TASKS; const it=list.find(x=>x.id===id);
  if(it){ pushUndo(); it.title=val; (kind==="proj"?saveProject:saveTask)(it); sync("update",{id, title:val}); }

    rows.push(`<div class="sr-row ${t.done?'done':''}"><span class="cbx ${t.done?'on':''}" data-scbx="task" data-id="${t.id}" style="color:${a.color||'#888'}">${ICON.check}</span><span class="sr-dot" style="background:${a.color||'#888'}"></span><div class="sr-main"><div class="sr-title">${a.emoji?a.emoji+' ':''}${t.title}</div><div class="sr-meta">Task · ${a.name||'—'} · ${fmtDay(t.day)}</div></div></div>`); });

function initTimeline(){
  const sc=document.querySelector('.tl-scroll'); if(!sc) return;
  const inner=document.querySelector('.tl-inner'); if(inner){ const dv=sc.clientWidth/COLW; inner.classList.toggle('compact', dv>21); inner.classList.toggle('daymode', dv<=16); }
  if(tlLeft==null) tlLeft=Math.max(0,(TODAY-win.start)*COLW - COLW*2);
  if(Math.abs(sc.scrollLeft-tlLeft)>0.5){ programmaticScroll=true; sc.scrollLeft=tlLeft; }
  updateTodayFab(sc);
  sc.addEventListener('scroll', ()=>{
    if(programmaticScroll){ programmaticScroll=false; tlLeft=sc.scrollLeft; updateTodayFab(sc); return; }
    tlLeft=sc.scrollLeft;
    updateTodayFab(sc);
    const now=Date.now();
    if(now-lastGrow<250) return;        // cooldown: momentum scrolling can't repeatedly re-trigger growth
    if(win.weeks>=140) return;          // hard cap on rendered span so the DOM can't explode
    const totalW=win.weeks*7*COLW;
    if(sc.scrollLeft+sc.clientWidth > totalW - COLW*4){ lastGrow=now; win.weeks+=4; mount(); }
    else if(sc.scrollLeft < COLW*4){ lastGrow=now; win.start-=28; win.weeks+=4; tlLeft+=28*COLW; mount(); }
  });
  /* pencil-only mode: cards are touch-action:none so the Pencil drags them instantly.
     That means a finger on a card no longer scrolls natively, so we pan the timeline ourselves. */
  let panT=null;
  sc.addEventListener('pointerdown', ev=>{
    if(!pPencilOnly || ev.pointerType!=='touch') return;
    if(!(ev.target.closest && (ev.target.closest('.chip')||ev.target.closest('.bar')))) return;  // empty gaps keep native (inertial) scroll
    panT={id:ev.pointerId, x:ev.clientX, y:ev.clientY, sl:sc.scrollLeft, st:sc.scrollTop};
    try{ sc.setPointerCapture(ev.pointerId); }catch(e){}
  });
  sc.addEventListener('pointermove', ev=>{
    if(!panT || ev.pointerId!==panT.id) return;
    if(pinch){ panT=null; return; }                     // yield to a 2-finger pinch-zoom
    sc.scrollLeft=panT.sl-(ev.clientX-panT.x);
    sc.scrollTop =panT.st-(ev.clientY-panT.y);
    tlLeft=sc.scrollLeft; updateTodayFab(sc);
  });
  const endPan=ev=>{ if(panT && ev.pointerId===panT.id) panT=null; };
  sc.addEventListener('pointerup', endPan);
  sc.addEventListener('pointercancel', endPan);
  initBars();
  initChips();
  initDivider();
}

function mount(){
  const app=document.getElementById('app');
  let body="";
  if(view.page==="timeline") body=renderTimeline();
  else if(view.page==="area") body=renderArea(view.area);
  else body=renderAreaForm(view.page); // add | edit

/* drag-to-pan + wheel/pinch-to-zoom on the cover preview */
function initCrop(){
  const el=document.getElementById('coverPrev'); if(!el) return;
  const apply=()=>{ el.style.cssText=coverStyle(draft); };
  let dragging=false, sx=0, sy=0, ox=0, oy=0;
  el.addEventListener('pointerdown', ev=>{
    if(ev.pointerType==='touch') return; // let touch scroll the form; pan with mouse/trackpad
    dragging=true; sx=ev.clientX; sy=ev.clientY;
    ox=(draft.coverX==null?50:draft.coverX); oy=(draft.coverY==null?50:draft.coverY);
    el.setPointerCapture(ev.pointerId);
  });
  el.addEventListener('pointermove', ev=>{
    if(!dragging) return;
    const w=el.clientWidth||1, h=el.clientHeight||1;
    // invert: dragging right should reveal the left side, like Notion
    draft.coverX=Math.max(0,Math.min(100, ox - (ev.clientX-sx)/w*100));
    draft.coverY=Math.max(0,Math.min(100, oy - (ev.clientY-sy)/h*100));
    apply();
  });
  const end=ev=>{ dragging=false; };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('wheel', ev=>{
    ev.preventDefault();
    const z=(draft.coverZoom==null?100:draft.coverZoom);
    draft.coverZoom=Math.max(100,Math.min(300, z - Math.sign(ev.deltaY)*-6));
    const sl=document.getElementById('cropZoom'); if(sl) sl.value=draft.coverZoom;
    apply();
  }, {passive:false});
  // pinch
  let pd=0, pz=100;
  el.addEventListener('touchmove', ev=>{
    if(ev.touches.length!==2) return;
    ev.preventDefault();
    const dx=ev.touches[0].clientX-ev.touches[1].clientX, dy=ev.touches[0].clientY-ev.touches[1].clientY;
    const dist=Math.hypot(dx,dy);
    if(pd===0){ pd=dist; pz=(draft.coverZoom==null?100:draft.coverZoom); return; }
    draft.coverZoom=Math.max(100,Math.min(300, pz*(dist/pd)));
    const sl=document.getElementById('cropZoom'); if(sl) sl.value=Math.round(draft.coverZoom);
    apply();
  }, {passive:false});
  el.addEventListener('touchend', ()=>{ pd=0; });
}

async function unsplashSearch(q){
  const grid=document.getElementById('unsGrid'), hint=document.getElementById('unsHint');
  if(hint) hint.textContent="Searching…";
  try{
    const res=await fetch(`https://api.unsplash.com/search/photos?per_page=12&query=${encodeURIComponent(q)}`,
      {headers:{Authorization:`Client-ID ${UNSPLASH_KEY}`}});
    if(!res.ok){ if(hint) hint.textContent = res.status===401?"Unsplash key rejected — check the key.":`Unsplash error (${res.status}).`; return; }
    const data=await res.json();
    draft._results=data.results.map(p=>({thumb:p.urls.thumb, full:p.urls.regular, credit:p.user.name}));
    draft._q=q;
    if(grid) grid.innerHTML=draft._results.map(r=>`<div class="uns-thumb ${draft.cover===r.full?'sel':''}" data-full="${r.full}" data-credit="${r.credit}" style="background-image:url('${r.thumb}')"></div>`).join("");
    if(hint) hint.textContent=draft._results.length?"":"No photos found.";
  }catch(err){ if(hint) hint.textContent="Couldn't reach Unsplash. If you're viewing this inside a preview, open the file directly in Safari — sandboxed previews block external requests."; }
}

/* ---- timeline zoom: smooth pinch (touch) + ctrl/⌘-wheel, focal-point anchored ----
   Layout is parametrised by the CSS var --colw, so zooming just updates that variable
   (no DOM rebuild) which keeps the gesture buttery on iPad. */
const MINCOLW=10;                       // ~3+ months can fit across a wide screen
function maxColw(){ const sc=document.querySelector('.tl-scroll'); return Math.max(160, sc?sc.clientWidth:900); } // a single day fills the view
let pinch=null, zoomRAF=0, zoomPersistT=0;

function applyZoom(newColw, focalClientX){
  const sc=document.querySelector('.tl-scroll'), inner=document.querySelector('.tl-inner'); if(!sc||!inner) return;
  newColw=Math.max(MINCOLW, Math.min(maxColw(), newColw));
  const rect=sc.getBoundingClientRect();
  const focalX=(focalClientX==null? sc.clientWidth/2 : focalClientX-rect.left);  // px from the left of the viewport
  const dayAtFocal=(sc.scrollLeft+focalX)/COLW;       // fractional day index under the focal point
  COLW=newColw;
  inner.style.setProperty('--colw', COLW+'px');
  sc.scrollLeft=dayAtFocal*COLW - focalX;             // keep that day pinned under the fingers
  tlLeft=sc.scrollLeft;
  const dv=sc.clientWidth/COLW; inner.classList.toggle('compact', dv>21); inner.classList.toggle('daymode', dv<=16);
  clearTimeout(zoomPersistT);
  zoomPersistT=setTimeout(()=>{ persistColw(); growForZoom(); }, 180);
}
/* Day / Week / Biweekly / Month buttons: zoom so N days fill the view, starting on today and looking forward */
function focusRange(days){
  const sc=document.querySelector('.tl-scroll'); if(!sc) return;
  COLW=Math.max(MINCOLW, Math.min(maxColw(), sc.clientWidth/days)); persistColw();
  const need=Math.ceil(days*1.6/7)+2; if(win.weeks<need) win.weeks=need;
  tlLeft=Math.max(0,(TODAY-win.start)*COLW - 2);   // today at the left edge, next N days ahead
  mount();
}
/* make sure the rendered window has enough days to fill the viewport once zoomed out */
function growForZoom(){
  const sc=document.querySelector('.tl-scroll'); if(!sc) return;
  const need=Math.ceil((sc.clientWidth/COLW)*1.6/7)+2;
  if(win.weeks<need){ win.weeks=need; if(view.page==='timeline' && !uiBusy()) mount(); }
}

document.addEventListener('touchstart', e=>{
  if(view.page!=='timeline' || uiBusy()) return;
  if(e.touches.length===2){
    const a=e.touches[0], b=e.touches[1];
    pinch={ d:Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), c:COLW, target:COLW, midX:(a.clientX+b.clientX)/2 };
    e.preventDefault();
  }
}, {passive:false});
document.addEventListener('touchmove', e=>{
  if(!pinch || e.touches.length!==2) return;
  e.preventDefault();
  const a=e.touches[0], b=e.touches[1];
  const d=Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
  pinch.target=pinch.c * d/pinch.d;
  pinch.midX=(a.clientX+b.clientX)/2;
  if(!zoomRAF) zoomRAF=requestAnimationFrame(()=>{ zoomRAF=0; if(pinch) applyZoom(pinch.target, pinch.midX); });
}, {passive:false});
function endPinch(e){ if(!e.touches || e.touches.length<2){ pinch=null; } }
document.addEventListener('touchend', endPinch);
document.addEventListener('touchcancel', endPinch);

document.addEventListener('wheel', e=>{
  if((e.ctrlKey||e.metaKey) && e.target.closest && e.target.closest('.tl-scroll')){
    e.preventDefault();
    applyZoom(COLW * Math.exp(-e.deltaY*0.0015), e.clientX);
  }
}, {passive:false});

/* ---- iPad gestures: double/triple-tap undo/redo, four-finger focus mode ---- */
let tapTimes=[], tdX=0, tdY=0, tdT=0;
document.addEventListener('pointerdown', e=>{ tdX=e.clientX; tdY=e.clientY; tdT=Date.now(); }, true);
document.addEventListener('pointerup', e=>{
  if(!pTapUndo) return;
  if(Math.abs(e.clientX-tdX)>8 || Math.abs(e.clientY-tdY)>8 || Date.now()-tdT>400){ tapTimes=[]; return; }
  const t=e.target;
  if(t.closest && (t.closest('.chip')||t.closest('.bar')||t.closest('button')||t.closest('input')||t.closest('.menu-pop')||t.closest('.search-box')||t.closest('.sched-drawer')||t.closest('.sidebar')||t.closest('[contenteditable="true"]'))){ tapTimes=[]; return; }
  if(!(t.closest && t.closest('.tl-scroll'))) return;
  const now=Date.now(); tapTimes=tapTimes.filter(x=>now-x<430); tapTimes.push(now);
  if(tapTimes.length>=3){ tapTimes=[]; redo(); }
  else if(tapTimes.length===2){ setTimeout(()=>{ if(tapTimes.length===2){ tapTimes=[]; undo(); } }, 290); }
});
let fourCand=false, fourT=0;
document.addEventListener('touchstart', e=>{ if(pFourFinger && e.touches.length===4){ fourCand=true; fourT=Date.now(); } }, {passive:true});
document.addEventListener('touchend', e=>{ if(pFourFinger && fourCand && e.touches.length===0){ if(Date.now()-fourT<700){ focusMode=!focusMode; applyFocusMode(); } fourCand=false; } });

/* ---------- Supabase persistence ---------- */
function areaToRow(key,a){return {id:key, name:a.name, emoji:a.emoji||"", graded:!!a.graded, color:a.color, tint:a.tint, ink:a.ink,
  cover:a.cover||"", cover_x:a.coverX==null?50:a.coverX, cover_y:a.coverY==null?50:a.coverY, cover_zoom:a.coverZoom==null?100:a.coverZoom,
  credit:a.credit||"", note:a.note||"", grades:a.grades||[]};}
function projToRow(p){return {id:p.id, area:p.area, title:p.title, description:p.desc||"", start_day:p.start, len:p.len, done:!!p.done, recurring:!!p.recurring};}
function taskToRow(t){return {id:t.id, area:t.area, title:t.title, description:t.desc||"", day:t.day, done:!!t.done, recurring:!!t.recurring, rec_days:Array.isArray(t.recDays)?t.recDays:[], ord:t.ord||0};}

async function saveArea(key){ if(!AREAS[key]) return; const {error}=await SB.from('areas').upsert(areaToRow(key,AREAS[key])); if(error) console.error('saveArea', error); }
async function saveProject(p){ const {error}=await SB.from('projects').upsert(projToRow(p)); if(error) console.error('saveProject', error); }
async function saveTask(t){ const {error}=await SB.from('tasks').upsert(taskToRow(t)); if(error) console.error('saveTask', error); }
async function deleteArea(key){
  sync("delete_project",{id:key});   // remove the Todoist project so it doesn't return on next sync
  const {error}=await SB.from('areas').delete().eq('id',key);
  if(error){ console.error('deleteArea', error); alert('Could not delete area: '+error.message); return; }
  delete AREAS[key];
  PROJECTS=PROJECTS.filter(p=>p.area!==key);
  TASKS=TASKS.filter(t=>t.area!==key);
  draft=null; view={page:"timeline",area:null}; mount();
}

async function loadData(){
  const [aRes,pRes,tRes]=await Promise.all([
    SB.from('areas').select('*').order('sort_order').order('created_at'),
    SB.from('projects').select('*').order('created_at'),
    SB.from('tasks').select('*').order('day').order('ord').order('created_at'),
  ]);
  if(aRes.error) throw aRes.error; if(pRes.error) throw pRes.error; if(tRes.error) throw tRes.error;
  AREAS={};
  (aRes.data||[]).forEach(a=>{ AREAS[a.id]={name:a.name, emoji:a.emoji||"", graded:a.graded, color:a.color, tint:a.tint, ink:a.ink,
    cover:a.cover||"", coverX:a.cover_x, coverY:a.cover_y, coverZoom:a.cover_zoom, credit:a.credit||"", note:a.note||"",
    grades:Array.isArray(a.grades)?a.grades:[]}; });
  PROJECTS=(pRes.data||[]).map(p=>({id:p.id, area:p.area, title:p.title, desc:p.description||"", start:p.start_day, len:p.len, done:p.done, recurring:!!p.recurring}));
  TASKS=(tRes.data||[]).map(t=>({id:t.id, area:t.area, title:t.title, desc:t.description||"", day:t.day, done:t.done, recurring:!!t.recurring, recDays:Array.isArray(t.rec_days)?t.rec_days:[], ord:t.ord||0}));
  try{ const uRes=await SB.from('unscheduled').select('*').order('created_at'); UNSCHED=(uRes.data||[]).map(u=>({id:u.id, area:u.area, title:u.title, isProject:u.is_project})); }catch(e){ UNSCHED=[]; }
}

async function seedDefaults(){
  let i=0;
  for(const [key,a] of Object.entries(DEFAULT_AREAS)){ await SB.from('areas').upsert({...areaToRow(key,a), sort_order:i++}); }
  for(const p of DEFAULT_PROJECTS){ await SB.from('projects').upsert(projToRow(p)); }
  for(const t of DEFAULT_TASKS){ await SB.from('tasks').upsert(taskToRow(t)); }
}

async function syncPull(){ const r=await sync("pull"); if(r && r.error) console.error("Todoist pull failed", r); await loadData(); }

/* cheap signature of visible state so background refreshes only re-render on real change */
function dataSig(){ return JSON.stringify([
  Object.keys(AREAS).sort(),
  PROJECTS.map(p=>[p.id,p.area,p.title,p.start,p.len,p.done]),
  TASKS.map(t=>[t.id,t.area,t.title,t.day,t.done,t.ord]),
  UNSCHED.length ]); }
/* true when the user is mid-interaction and a silent re-render would be disruptive */
function uiBusy(){ return searchOpen||settingsOpen||addOpen||editOpen||schedOpen||menuOpen||!!editing||!!draft; }

const SYNC_INTERVAL=30000;   // background Todoist sync cadence
async function backgroundSync(){
  if(view.page!=="timeline" || uiBusy() || pending>0) return;
  const before=dataSig();
  try{ await syncPull(); }catch(e){ console.error("bg sync", e); return; }
  if(view.page==="timeline" && !uiBusy() && dataSig()!==before) mount();
}

async function init(){
  try{ await loadData(); }catch(err){ console.error("initial load failed", err); }
  mount();
  /* pull from Todoist in the background, then refresh once it lands */
  const before=dataSig();
  syncPull().then(()=>{ if(view.page==="timeline" && !uiBusy() && dataSig()!==before) mount(); })
            .catch(e=>console.error("initial sync", e));
  setInterval(backgroundSync, SYNC_INTERVAL);
}
/* ---- basic access gate (client-side; stops casual access, not a hard security boundary) ---- */
const PASS_HASH="e0044cc6bc75988bf0afe2a60068a4d7ab7c4e0790ce51b7a32796da101aec8d"; // sha256 of the password
async function sha256hex(s){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function authed(){ try{ return localStorage.getItem('tms_auth')==='ok'; }catch(e){ return false; } }
function lockOut(){ try{ localStorage.removeItem('tms_auth'); }catch(e){} location.reload(); }
function renderGate(msg){
  document.getElementById('app').innerHTML=`<div class="gate"><div class="gate-box"><div class="gate-title">TMS</div><input type="password" id="gatePass" placeholder="Password"><button class="txt-btn primary" id="gateGo">Enter</button><div class="gate-msg" id="gateMsg">${msg||''}</div></div></div>`;
  const inp=document.getElementById('gatePass'); if(inp) inp.focus();
  const go=async()=>{ const v=(document.getElementById('gatePass').value||''); const h=await sha256hex(v);
    if(h===PASS_HASH){ try{ localStorage.setItem('tms_auth','ok'); }catch(e){} init(); }
    else { const m=document.getElementById('gateMsg'); if(m) m.textContent='Incorrect password'; const p=document.getElementById('gatePass'); if(p){ p.value=''; p.focus(); } } };
  document.getElementById('gateGo').addEventListener('click', go);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
}
if(authed()) init(); else renderGate();
</script>
